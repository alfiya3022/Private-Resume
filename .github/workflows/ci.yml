name: PrivateResume Continuous Integration

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Pytest & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: private_resume
          POSTGRES_USER: private_resume_user
          POSTGRES_PASSWORD: private_resume_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (LaTeX for ATS compilation)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-fonts-extra

      - name: Install Backend Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql://private_resume_user:private_resume_password@localhost:5432/private_resume
        run: |
          cd backend
          alembic upgrade head

      - name: Run Automated Test Suite (Pytest)
        env:
          DATABASE_URL: postgresql://private_resume_user:private_resume_password@localhost:5432/private_resume
          SECRET_KEY: ci-test-secret-key-32-chars-long-minimum!
        run: |
          cd backend
          pytest tests/ -v

  frontend-build:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Frontend Assets
        run: |
          cd frontend
          npm run build
